name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Audit dependencies
        working-directory: mcp
        run: npm audit --package-lock-only --audit-level=high
