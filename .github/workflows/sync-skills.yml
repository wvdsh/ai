name: Sync skills from docs.wavedash.com

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Sync skills
        run: node scripts/sync.js

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: sync/skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills \
            providers/claude/plugin/skills \
            providers/cursor/plugin/skills \
            providers/openai/plugin/skills
          if git diff --cached --quiet; then
            echo "Skills match main."
            if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
              git push origin --delete "$BRANCH"
            fi
            exit 0
          fi
          if git fetch --depth 1 origin "$BRANCH" && git diff --cached --quiet FETCH_HEAD; then
            echo "Pull request is already up to date."
            exit 0
          fi
          git switch -c "$BRANCH"
          git commit -m "sync skills"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Sync skills from docs.wavedash.com" \
              --body "Automated sync of skill files fetched from https://docs.wavedash.com/.well-known/skills. These files are instructions that coding agents execute, so read the diff before merging. This pull request is force-updated daily while it stays open."
          fi
