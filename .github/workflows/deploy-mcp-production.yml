name: Deploy MCP to Production

concurrency:
  group: deploy-mcp-production
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "mcp/src/**"
      - "mcp/package.json"
      - "mcp/package-lock.json"
      - "mcp/wrangler.toml"
      - "package.json"
      - ".github/workflows/deploy-mcp-production.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy MCP to Production
    permissions:
      contents: read
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm --prefix mcp ci

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4.0.1

      - name: Validate Worker bundle
        run: doppler run -- npm run mcp:deploy:dry-run

      - name: Deploy MCP Worker
        run: doppler run -- npm run mcp:deploy
